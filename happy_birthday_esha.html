<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Esha! 🎂</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0010; overflow: hidden; font-family: 'Georgia', serif; }

  #scene { width: 100vw; height: 100vh; position: relative; display: flex; align-items: center; justify-content: center; }

  /* LIGHTS */
  #lights-overlay { position: absolute; inset: 0; background: #0a0010; z-index: 100; transition: opacity 1.5s ease; }
  .bulb-row { position: absolute; top: 0; left: 0; width: 100%; display: flex; justify-content: space-around; padding: 10px 20px; }
  .bulb { width: 18px; height: 26px; border-radius: 50% 50% 40% 40%; background: #222; position: relative; transition: background 0.3s, box-shadow 0.3s; }
  .bulb::before { content: ''; position: absolute; top: -8px; left: 7px; width: 4px; height: 10px; background: #444; border-radius: 2px; }
  .bulb.on-r { background: #ff4466; box-shadow: 0 0 12px 6px #ff446688, 0 0 30px 10px #ff446644; }
  .bulb.on-g { background: #44ff88; box-shadow: 0 0 12px 6px #44ff8888, 0 0 30px 10px #44ff8844; }
  .bulb.on-b { background: #4488ff; box-shadow: 0 0 12px 6px #4488ff88, 0 0 30px 10px #4488ff44; }
  .bulb.on-y { background: #ffdd44; box-shadow: 0 0 12px 6px #ffdd4488, 0 0 30px 10px #ffdd4444; }
  .wire { position: absolute; top: 22px; left: 0; width: 100%; height: 2px; background: #555; z-index: -1; }

  /* ROOM BG */
  #room { position: absolute; inset: 0; background: linear-gradient(180deg, #1a0030 0%, #2d0050 40%, #1a0025 100%); opacity: 0; transition: opacity 2s ease; }
  #floor { position: absolute; bottom: 0; left: 0; right: 0; height: 30%; background: linear-gradient(180deg, #3d1060 0%, #1a0030 100%); }
  .star { position: absolute; border-radius: 50%; background: white; animation: twinkle 2s infinite alternate; }

  /* CARD */
  #card-wrap { position: absolute; z-index: 20; perspective: 800px; opacity: 0; transform: scale(0.5) translateY(60px); transition: opacity 0.8s, transform 0.8s; }
  #card-outer { width: 340px; height: 420px; position: relative; transform-style: preserve-3d; }
  #card-front { width: 340px; height: 420px; background: linear-gradient(135deg, #ff1a6e 0%, #ff6b9d 50%, #ffb3d1 100%); border-radius: 20px; position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 20px 60px #ff1a6e88; }
  #ribbon-h { position: absolute; top: 50%; left: 0; right: 0; height: 28px; background: linear-gradient(90deg, #ffd700, #ffec6e, #ffd700); transform: translateY(-50%); box-shadow: 0 2px 8px #ffd70088; z-index: 5; transition: transform 1.2s cubic-bezier(.4,2,.6,1), opacity 0.8s; transform-origin: center; }
  #ribbon-v { position: absolute; left: 50%; top: 0; bottom: 0; width: 28px; background: linear-gradient(180deg, #ffd700, #ffec6e, #ffd700); transform: translateX(-50%); box-shadow: 0 2px 8px #ffd70088; z-index: 5; transition: transform 1.2s cubic-bezier(.4,2,.6,1), opacity 0.8s; transform-origin: center; }
  #bow { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 70px; height: 50px; z-index: 6; transition: transform 1.2s ease, opacity 0.8s; }
  .bow-loop { width: 28px; height: 20px; border-radius: 50%; background: linear-gradient(135deg, #ffd700, #ffec6e); position: absolute; top: 0; }
  .bow-loop.l { left: 0; transform: rotate(-30deg); }
  .bow-loop.r { right: 0; transform: rotate(30deg); }
  .bow-knot { width: 16px; height: 16px; border-radius: 50%; background: #ffd700; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); box-shadow: 0 2px 8px #ffd70066; }
  .bow-tail { width: 14px; height: 18px; background: linear-gradient(180deg, #ffd700, #ffec6e); position: absolute; bottom: -14px; border-radius: 0 0 8px 8px; }
  .bow-tail.l { left: 18px; transform: rotate(-10deg); }
  .bow-tail.r { right: 18px; transform: rotate(10deg); }
  #card-inner-content { opacity: 0; transition: opacity 1s; text-align: center; padding: 20px; }
  #card-inner-content h2 { color: #fff; font-size: 22px; text-shadow: 0 2px 8px #ff1a6e; margin-bottom: 10px; }
  #card-inner-content p { color: #ffe0ee; font-size: 14px; line-height: 1.6; }
  .hearts { font-size: 28px; margin-bottom: 8px; }

  /* CAKE */
  #cake-wrap { position: absolute; bottom: 28%; opacity: 0; transform: translateY(120px); transition: opacity 1s, transform 1s cubic-bezier(.2,1.4,.4,1); z-index: 15; }
  #cake { display: flex; flex-direction: column; align-items: center; }
  .cake-layer { border-radius: 8px; position: relative; }
  .layer-top { width: 160px; height: 50px; background: linear-gradient(180deg, #ff80ab, #ff4081); box-shadow: 0 4px 0 #c2185b; margin-bottom: -2px; }
  .layer-mid { width: 200px; height: 55px; background: linear-gradient(180deg, #f48fb1, #e91e63); box-shadow: 0 4px 0 #880e4f; margin-bottom: -2px; }
  .layer-bot { width: 240px; height: 60px; background: linear-gradient(180deg, #f8bbd0, #f06292); box-shadow: 0 5px 0 #ad1457; }
  .frosting { position: absolute; top: -10px; left: 0; right: 0; display: flex; justify-content: space-around; }
  .drip { width: 14px; height: 18px; background: #fff; border-radius: 0 0 50% 50%; opacity: 0.9; }
  .candle-row { display: flex; gap: 18px; margin-bottom: 2px; }
  .candle { width: 10px; height: 36px; border-radius: 4px; position: relative; }
  .c1 { background: linear-gradient(180deg, #ff4444, #ff8888); }
  .c2 { background: linear-gradient(180deg, #4444ff, #8888ff); }
  .c3 { background: linear-gradient(180deg, #44ff44, #88ff88); }
  .c4 { background: linear-gradient(180deg, #ffff44, #ffff88); }
  .c5 { background: linear-gradient(180deg, #ff44ff, #ff88ff); }
  .flame { width: 10px; height: 16px; position: absolute; top: -16px; left: 0; opacity: 0; transition: opacity 0.4s; }
  .flame svg { width: 10px; height: 16px; animation: flicker 0.4s infinite alternate; }
  .flame.lit { opacity: 1; }

  /* PHOTO FRAME */
  #photo-section { position: absolute; z-index: 30; opacity: 0; transform: translateY(40px) scale(0.8); transition: opacity 1.2s, transform 1.2s cubic-bezier(.2,1.3,.4,1); display: flex; flex-direction: column; align-items: center; }
  #photo-frame { width: 130px; height: 130px; border-radius: 50%; border: 5px solid #ffd700; box-shadow: 0 0 0 4px #ff4081, 0 0 30px #ffd70088; overflow: hidden; background: linear-gradient(135deg, #ff80ab, #ffd700, #ff4081); display: flex; align-items: center; justify-content: center; margin-bottom: 16px; position: relative; }
  #photo-frame .initials { font-size: 52px; font-weight: bold; color: #fff; text-shadow: 0 2px 12px #ff4081; font-family: 'Georgia', serif; }
  #photo-upload-hint { font-size: 11px; color: #ffb3d1; margin-top: -10px; margin-bottom: 10px; }

  /* BIG TEXT */
  #hb-text { position: absolute; top: 8%; z-index: 25; text-align: center; opacity: 0; transform: scale(0.5); transition: opacity 1s, transform 1s cubic-bezier(.2,1.5,.4,1); }
  #hb-text h1 { font-size: clamp(28px, 5vw, 48px); color: #ffd700; text-shadow: 0 0 20px #ffd700, 0 0 40px #ff4081; letter-spacing: 3px; font-family: 'Georgia', serif; }
  #hb-text h2 { font-size: clamp(22px, 4vw, 38px); color: #ff80ab; text-shadow: 0 0 15px #ff4081; font-family: 'Georgia', serif; margin-top: 6px; }
  #hb-text p { color: #ffe0ee; font-size: 14px; margin-top: 8px; letter-spacing: 1px; }

  /* CONFETTI */
  .confetti { position: absolute; width: 8px; height: 8px; border-radius: 2px; top: -10px; animation: fall linear infinite; z-index: 50; pointer-events: none; }

  #photo-img { width: 100%; height: 100%; object-fit: cover; display: none; border-radius: 50%; }

  /* PLAY AGAIN */
  #replay-btn { position: absolute; bottom: 10px; left: 10px; z-index: 200; background: rgba(100,0,150,0.4); border: 1px solid #9b59b6; color: #e8b4ff; padding: 6px 14px; border-radius: 20px; cursor: pointer; font-size: 12px; display: none; }
  #replay-btn:hover { background: rgba(100,0,150,0.6); }

  /* SPARKLES */
  .sparkle { position: absolute; pointer-events: none; animation: sparkle-anim 1s infinite alternate; }
  .sparkle::before { content: '✦'; color: #ffd700; font-size: 16px; }

  @keyframes twinkle { from { opacity: 0.2; } to { opacity: 1; } }
  @keyframes flicker { from { transform: scaleX(0.85) scaleY(0.95); } to { transform: scaleX(1.1) scaleY(1.05); } }
  @keyframes fall { 0% { top: -10px; opacity: 1; } 100% { top: 110vh; opacity: 0; } }
  @keyframes sparkle-anim { from { transform: scale(0.8) rotate(0deg); opacity: 0.6; } to { transform: scale(1.3) rotate(30deg); opacity: 1; } }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
  @keyframes pulse-glow { 0%,100% { text-shadow: 0 0 20px #ffd700, 0 0 40px #ff4081; } 50% { text-shadow: 0 0 40px #ffd700, 0 0 80px #ff4081, 0 0 120px #ff80ab; } }
</style>
</head>
<body>
<div id="scene">

  <!-- Stars / Room Background -->
  <div id="room">
    <div id="floor"></div>
  </div>

  <!-- Lights at top -->
  <div style="position:absolute;top:0;left:0;right:0;z-index:10;">
    <div class="wire"></div>
    <div class="bulb-row" id="bulb-row"></div>
  </div>

  <!-- Dark overlay that lifts -->
  <div id="lights-overlay"></div>

  <!-- CARD -->
  <div id="card-wrap">
    <div id="card-outer">
      <div id="card-front">
        <div id="ribbon-h"></div>
        <div id="ribbon-v"></div>
        <div id="bow">
          <div class="bow-loop l"></div>
          <div class="bow-loop r"></div>
          <div class="bow-knot"></div>
          <div class="bow-tail l"></div>
          <div class="bow-tail r"></div>
        </div>
        <div id="card-inner-content">
          <div class="hearts">💖</div>
          <h2>With all my love,<br>your little sibling 🌸</h2>
          <p>You are my sunshine,<br>my guiding star,<br>my forever hero.</p>
        </div>
      </div>
    </div>
  </div>

  <!-- CAKE -->
  <div id="cake-wrap">
    <div id="cake">
      <div class="candle-row">
        <div class="candle c1"><div class="flame" id="f1"><svg viewBox="0 0 10 16"><ellipse cx="5" cy="11" rx="4" ry="5" fill="#ff9900"/><ellipse cx="5" cy="8" rx="2.5" ry="4" fill="#ffdd00"/><ellipse cx="5" cy="6" rx="1.5" ry="2.5" fill="#fff"/></svg></div></div>
        <div class="candle c2"><div class="flame" id="f2"><svg viewBox="0 0 10 16"><ellipse cx="5" cy="11" rx="4" ry="5" fill="#ff9900"/><ellipse cx="5" cy="8" rx="2.5" ry="4" fill="#ffdd00"/><ellipse cx="5" cy="6" rx="1.5" ry="2.5" fill="#fff"/></svg></div></div>
        <div class="candle c3"><div class="flame" id="f3"><svg viewBox="0 0 10 16"><ellipse cx="5" cy="11" rx="4" ry="5" fill="#ff9900"/><ellipse cx="5" cy="8" rx="2.5" ry="4" fill="#ffdd00"/><ellipse cx="5" cy="6" rx="1.5" ry="2.5" fill="#fff"/></svg></div></div>
        <div class="candle c4"><div class="flame" id="f4"><svg viewBox="0 0 10 16"><ellipse cx="5" cy="11" rx="4" ry="5" fill="#ff9900"/><ellipse cx="5" cy="8" rx="2.5" ry="4" fill="#ffdd00"/><ellipse cx="5" cy="6" rx="1.5" ry="2.5" fill="#fff"/></svg></div></div>
        <div class="candle c5"><div class="flame" id="f5"><svg viewBox="0 0 10 16"><ellipse cx="5" cy="11" rx="4" ry="5" fill="#ff9900"/><ellipse cx="5" cy="8" rx="2.5" ry="4" fill="#ffdd00"/><ellipse cx="5" cy="6" rx="1.5" ry="2.5" fill="#fff"/></svg></div></div>
      </div>
      <div class="cake-layer layer-top">
        <div class="frosting" style="justify-content:space-evenly">
          <div class="drip"></div><div class="drip"></div><div class="drip"></div><div class="drip"></div><div class="drip"></div>
        </div>
      </div>
      <div class="cake-layer layer-mid">
        <div class="frosting">
          <div class="drip"></div><div class="drip"></div><div class="drip"></div><div class="drip"></div><div class="drip"></div><div class="drip"></div>
        </div>
        <div style="text-align:center;padding-top:16px;font-size:13px;color:#fff;text-shadow:0 1px 4px #c2185b;font-family:Georgia,serif;letter-spacing:1px;">Happy Birthday! 🌸</div>
      </div>
      <div class="cake-layer layer-bot">
        <div class="frosting">
          <div class="drip"></div><div class="drip"></div><div class="drip"></div><div class="drip"></div><div class="drip"></div><div class="drip"></div><div class="drip"></div>
        </div>
        <div style="text-align:center;padding-top:18px;font-size:14px;color:#fff;font-weight:bold;text-shadow:0 1px 6px #880e4f;font-family:Georgia,serif;">✨ Esha ✨</div>
      </div>
    </div>
  </div>

  <!-- HAPPY BIRTHDAY TEXT -->
  <div id="hb-text">
    <h1 style="animation: pulse-glow 2s infinite;">🎂 Happy Birthday 🎂</h1>
    <h2 style="animation: float 3s ease-in-out infinite;">Dearest Esha! 💖</h2>
    <p>My big sister, my forever star 🌟</p>
  </div>

  <!-- PHOTO SECTION -->
  <div id="photo-section" style="bottom: 12%;">
    <div id="photo-frame">
      <span class="initials" id="initials-text">E</span>
      <img id="photo-img" alt="Esha" />
    </div>
    <div id="photo-upload-hint"></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:4px;">
      <span style="background:rgba(255,64,129,0.25);border:1px solid #ff4081;color:#ffb3d1;padding:4px 14px;border-radius:20px;font-size:12px;">Big Sister 👑</span>
      <span style="background:rgba(255,215,0,0.2);border:1px solid #ffd700;color:#ffd700;padding:4px 14px;border-radius:20px;font-size:12px;">Forever Hero 💛</span>
    </div>
  </div>

  <!-- REPLAY BUTTON -->
  <button id="replay-btn" onclick="startShow()">🔄 Replay</button>

</div>

<script>
const colors = ['on-r','on-g','on-b','on-y'];
let confettiInterval;

function makeBulbs() {
  const row = document.getElementById('bulb-row');
  row.innerHTML = '';
  const n = Math.floor(window.innerWidth / 55);
  for (let i = 0; i < n; i++) {
    const b = document.createElement('div');
    b.className = 'bulb';
    b.id = 'bulb-' + i;
    row.appendChild(b);
  }
}

function makeStars() {
  const room = document.getElementById('room');
  for (let i = 0; i < 60; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 2.5 + 0.5;
    s.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}%;top:${Math.random()*65}%;animation-delay:${Math.random()*2}s;animation-duration:${1.5+Math.random()*2}s;opacity:${Math.random()*0.8+0.2}`;
    room.appendChild(s);
  }
}

function spawnConfetti() {
  const scene = document.getElementById('scene');
  const confettiColors = ['#ff4081','#ffd700','#4fc3f7','#aed581','#ce93d8','#ff8a65','#fff'];
  const c = document.createElement('div');
  c.className = 'confetti';
  c.style.left = Math.random()*100 + 'vw';
  c.style.background = confettiColors[Math.floor(Math.random()*confettiColors.length)];
  c.style.animationDuration = (2.5+Math.random()*3)+'s';
  c.style.animationDelay = (Math.random()*1)+'s';
  c.style.transform = `rotate(${Math.random()*360}deg)`;
  c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
  scene.appendChild(c);
  setTimeout(() => c.remove(), 6000);
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

async function startShow() {
  clearInterval(confettiInterval);
  document.querySelectorAll('.confetti').forEach(e => e.remove());

  // Reset all elements
  const overlay = document.getElementById('lights-overlay');
  const room = document.getElementById('room');
  const cardWrap = document.getElementById('card-wrap');
  const cardContent = document.getElementById('card-inner-content');
  const ribbonH = document.getElementById('ribbon-h');
  const ribbonV = document.getElementById('ribbon-v');
  const bow = document.getElementById('bow');
  const cakeWrap = document.getElementById('cake-wrap');
  const hbText = document.getElementById('hb-text');
  const photoSection = document.getElementById('photo-section');
  const replayBtn = document.getElementById('replay-btn');

  overlay.style.opacity = '1'; overlay.style.transition = 'none';
  room.style.opacity = '0'; room.style.transition = 'none';
  cardWrap.style.opacity = '0'; cardWrap.style.transform = 'scale(0.5) translateY(60px)'; cardWrap.style.transition = 'none';
  cardContent.style.opacity = '0'; cardContent.style.transition = 'none';
  ribbonH.style.transform = 'translateY(-50%) scaleX(1)'; ribbonH.style.opacity = '1'; ribbonH.style.transition = 'none';
  ribbonV.style.transform = 'translateX(-50%) scaleY(1)'; ribbonV.style.opacity = '1'; ribbonV.style.transition = 'none';
  bow.style.transform = 'translate(-50%,-50%) scale(1)'; bow.style.opacity = '1'; bow.style.transition = 'none';
  cakeWrap.style.opacity = '0'; cakeWrap.style.transform = 'translateY(120px)'; cakeWrap.style.transition = 'none';
  hbText.style.opacity = '0'; hbText.style.transform = 'scale(0.5)'; hbText.style.transition = 'none';
  photoSection.style.opacity = '0'; photoSection.style.transform = 'translateY(40px) scale(0.8)'; photoSection.style.transition = 'none';
  replayBtn.style.display = 'none';
  document.querySelectorAll('.flame').forEach(f => f.classList.remove('lit'));

  makeBulbs();
  const bulbs = document.querySelectorAll('.bulb');

  await sleep(400);

  // PHASE 1: Lights flickering on
  for (let pass = 0; pass < 3; pass++) {
    for (let i = 0; i < bulbs.length; i++) {
      const b = bulbs[i];
      b.className = 'bulb ' + colors[(i + pass) % 4];
      await sleep(40);
    }
  }
  await sleep(300);

  // Room reveals
  overlay.style.transition = 'opacity 1.5s ease';
  overlay.style.opacity = '0';
  room.style.transition = 'opacity 2s ease';
  room.style.opacity = '1';
  await sleep(1800);

  // PHASE 2: Card arrives
  cardWrap.style.transition = 'opacity 0.8s, transform 0.8s cubic-bezier(.2,1.3,.4,1)';
  cardWrap.style.opacity = '1';
  cardWrap.style.transform = 'scale(1) translateY(0)';
  await sleep(1200);

  // PHASE 3: Ribbon opens
  ribbonH.style.transition = 'transform 1.2s cubic-bezier(.4,2,.6,1), opacity 0.8s';
  ribbonV.style.transition = 'transform 1.2s cubic-bezier(.4,2,.6,1), opacity 0.8s';
  bow.style.transition = 'transform 1.2s ease, opacity 0.8s';
  ribbonH.style.transform = 'translateY(-50%) scaleX(0)';
  ribbonV.style.transform = 'translateX(-50%) scaleY(0)';
  bow.style.transform = 'translate(-50%,-50%) scale(0)';
  ribbonH.style.opacity = '0';
  ribbonV.style.opacity = '0';
  bow.style.opacity = '0';
  await sleep(700);
  cardContent.style.transition = 'opacity 1s';
  cardContent.style.opacity = '1';
  await sleep(1600);

  // Shrink card to corner
  cardWrap.style.transition = 'all 1s ease';
  cardWrap.style.transform = 'scale(0.35) translate(280px, -280px)';
  cardWrap.style.opacity = '0.7';
  await sleep(1100);

  // PHASE 4: Cake rolls in
  cakeWrap.style.transition = 'opacity 1s, transform 1s cubic-bezier(.2,1.4,.4,1)';
  cakeWrap.style.opacity = '1';
  cakeWrap.style.transform = 'translateY(0)';
  await sleep(1200);

  // PHASE 5: Light candles one by one
  for (let i = 1; i <= 5; i++) {
    document.getElementById('f'+i).classList.add('lit');
    await sleep(350);
  }
  await sleep(600);

  // PHASE 6: Happy Birthday text
  hbText.style.transition = 'opacity 1s, transform 1s cubic-bezier(.2,1.5,.4,1)';
  hbText.style.opacity = '1';
  hbText.style.transform = 'scale(1)';
  await sleep(1000);

  // PHASE 7: Photo
  photoSection.style.transition = 'opacity 1.2s, transform 1.2s cubic-bezier(.2,1.3,.4,1)';
  photoSection.style.opacity = '1';
  photoSection.style.transform = 'translateY(0) scale(1)';
  await sleep(800);

  // CONFETTI!
  confettiInterval = setInterval(spawnConfetti, 200);
  addSparkles();

  replayBtn.style.display = 'block';
}

function addSparkles() {
  const hb = document.getElementById('hb-text');
  hb.querySelectorAll('.sparkle').forEach(s => s.remove());
  const positions = [[-30,-10],[240,-10],[-30,50],[240,50],[100,-30]];
  positions.forEach(([x,y],i) => {
    const sp = document.createElement('div');
    sp.className = 'sparkle';
    sp.style.left = x + 'px';
    sp.style.top = y + 'px';
    sp.style.animationDelay = (i*0.2) + 's';
    sp.style.animationDuration = (0.8+i*0.15) + 's';
    hb.appendChild(sp);
  });
}

// ============================================================
//  👇 SET YOUR PHOTO HERE
//  Put Esha's photo in the SAME folder as this HTML file,
//  then replace "esha.jpg" below with the exact filename.
//  Supported formats: .jpg  .jpeg  .png  .webp  .gif
// ============================================================
const PHOTO_FILENAME = 'esha.jpg';
// ============================================================

function loadPhoto() {
  const img = document.getElementById('photo-img');
  const initials = document.getElementById('initials-text');
  const hint = document.getElementById('photo-upload-hint');
  img.src = PHOTO_FILENAME;
  img.onload = function() {
    img.style.display = 'block';
    initials.style.display = 'none';
    hint.textContent = '🌸 Looking beautiful, Esha!';
  };
  img.onerror = function() {
    hint.textContent = '📁 Place ' + PHOTO_FILENAME + ' in the same folder as this file.';
    hint.style.color = '#ffdd88';
  };
}

makeStars();
loadPhoto();
startShow();
</script>
</body>
</html>
